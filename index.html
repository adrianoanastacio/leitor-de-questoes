<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070908">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<title>Leitor de Questões</title>
<link rel="stylesheet" href="style.css">
<style>[hidden] { display: none !important; } body { margin: 0; } img { max-width: 100%; }</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 15"/></symbol>
  <symbol id="i-files" viewBox="0 0 24 24"><path d="M8 3h7l4 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v4h4M3 7v12a3 3 0 0 0 3 3h9"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 4v16"/><path d="M19 5v14a.8.8 0 0 1-1.2.7L8.5 12.7a.8.8 0 0 1 0-1.4l9.3-7a.8.8 0 0 1 1.2.7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 4v16"/><path d="M5 5v14a.8.8 0 0 0 1.2.7l9.3-7a.8.8 0 0 0 0-1.4l-9.3-7A.8.8 0 0 0 5 5z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3.5c2 0 3.2 1 4.3 2.7l2.4 3.6c1.1 1.7 2.3 2.7 4.3 2.7H21M3 18h3.5c1.4 0 2.4-.5 3.2-1.3M14.3 7.3c.8-.8 1.8-1.3 3.2-1.3H21"/><path d="m18 3 3 3-3 3M18 12l3 3-3 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-review" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 18V6.5C7 5 9.6 5.2 12 7c2.4-1.8 5-2 8-.5V18c-3-1.5-5.6-1.3-8 .5-2.4-1.8-5-2-8-.5z" stroke-width="2.4"/></symbol>
</svg>

<div class="shell" id="shell">
  <header class="top">
    <button class="iconbtn only-narrow" id="toggleSide" aria-label="Abrir biblioteca"><svg class="i"><use href="#i-menu"/></svg></button>
    <div class="brand"><span class="logo" aria-hidden="true"><svg class="i"><use href="#i-logo"/></svg></span><span class="name">Leitor de Questões</span></div>
    <label class="search" for="q"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar questão, número ou palavra" autocomplete="off"></label>
    <button class="pillbtn" id="openBtn" title="Abrir PDF (Ctrl+O)"><svg class="i"><use href="#i-plus"/></svg><span class="tx">Abrir PDF</span></button>
  </header>

  <nav class="side" id="side" aria-label="Biblioteca">
    <div class="panel navp" id="navp">
      <button data-nav="pdfs"><svg class="i"><use href="#i-files"/></svg>Meus PDFs</button>
      <button data-nav="book"><svg class="i"><use href="#i-book"/></svg>Livro</button>
      <button data-nav="home"><svg class="i"><use href="#i-home"/></svg>Início</button>
      <button data-nav="search"><svg class="i"><use href="#i-search"/></svg>Buscar</button>
    </div>
    <div class="panel lib">
      <div class="lib-head"><span><svg class="i"><use href="#i-lib"/></svg>Sua biblioteca</span><button class="iconbtn" id="newMat" title="Nova matéria" aria-label="Nova matéria"><svg class="i"><use href="#i-plus"/></svg></button></div>
      <div class="chipsrow" id="libFilters"></div>
      <div class="libbody" id="libBody"><div class="libempty"><b>Abra um PDF</b>Suas matérias, as listas de revisão e as seções do livro aparecem aqui.</div></div>
    </div>
  </nav>

  <main class="stage" id="stage">
    <div class="viewer" id="viewer"><div class="pages" id="pages"></div></div>
    <div class="view" id="view" hidden></div>
  </main>

  <footer class="player" id="player">
    <div class="np">
      <button class="np-art blank" id="npArt" aria-label="Ir para a questão atual"></button>
      <button class="np-txt" id="npTxt"><b>Nenhuma questão</b><small>Abra um PDF para começar</small></button>
    </div>
    <div class="ctl">
      <div class="btns">
        <button class="iconbtn hide-narrow" id="pShuffle" title="Sortear uma questão que falta" aria-label="Sortear questão"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="iconbtn" id="pPrev" title="Anterior (K)" aria-label="Questão anterior"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="main" id="pDone" title="Marcar como feita (F)" aria-label="Marcar como feita" aria-pressed="false"><svg class="i"><use href="#i-check"/></svg></button>
        <button class="iconbtn" id="pNext" title="Próxima (J)" aria-label="Próxima questão"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="iconbtn" id="pRev" title="Revisar depois (V)" aria-label="Revisar depois"><svg class="i"><use href="#i-review"/></svg></button>
      </div>
      <div class="prog"><span class="ctx" id="pCtx">—</span><div class="pbar" id="pbar" role="slider" aria-label="Posição na lista" tabindex="0"><div class="track" id="ptrack"></div><div class="knob" id="pknob"></div></div><span id="pTot">0</span></div>
    </div>
    <div class="tools">
      <button class="iconbtn" id="tPrint" title="Copiar print da questão (P)" aria-label="Copiar print"><svg class="i"><use href="#i-copy"/></svg></button>
      <button class="iconbtn" id="toggleDetect" title="Mostrar faixas das questões" aria-label="Mostrar faixas" aria-pressed="true"><svg class="i"><use href="#i-layers"/></svg></button>
      <label class="zoom" title="Tamanho da página"><svg class="i"><use href="#i-zoom"/></svg><input type="range" id="zoom" min="60" max="160" step="10" value="100" aria-label="Tamanho da página"></label>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<script src="sync.js"></script>
<script src="api-web.js"></script>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // quando chega uma versão nova do app, recarrega uma vez para já usar ela
  const tinha = !!navigator.serviceWorker.controller; let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinha && !recarregou) { recarregou = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
</script>
</body>
</html>
